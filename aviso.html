<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B33">
<title>Pregador Visual · Avisos</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="supabase.min.js"></script>
<style>
:root{ --bg:#0B1426; --card:#0F1B33; --ouro:#C9A227; --txt:#F2EEE3; --txt2:#B9C0D3; --linha:rgba(201,162,39,.3); --ok:#3DDC84; --erro:#E5484D }
:root[data-theme="light"]{ --bg:#F6F1E6; --card:#FFFDF8; --ouro:#9A7B12; --txt:#14213F; --txt2:#55607A; --linha:rgba(15,27,51,.18); --ok:#1E9E5A }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Source Sans 3',system-ui,sans-serif;font-size:17px;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--linha)}
.topo h1{font-family:Cinzel,serif;color:var(--ouro);font-size:20px;line-height:1.1}
.versao{font-size:12px;color:var(--txt2)}
.icone{width:40px;height:40px;border-radius:10px;border:1px solid var(--linha);display:inline-flex;align-items:center;justify-content:center}
.icone svg{width:20px;height:20px}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:16px;margin-bottom:14px}
.rot{display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);font-weight:700;margin-bottom:8px}
textarea,input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linha);background:rgba(201,162,39,.06);color:var(--txt)}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--ouro)}
#codigo{font-family:Cinzel,serif;letter-spacing:.3em;text-align:center;text-transform:uppercase;font-size:26px}
.seg{display:flex;border:1px solid var(--linha);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;font-size:15px}
.seg button.on{background:var(--ouro);color:#0F1B33;font-weight:700}
.botao{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:18px;border:1.5px solid var(--linha)}
.botao.prim{background:var(--ouro);color:#0F1B33;border-color:var(--ouro)}
.botoes{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:4px}
.estado{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--txt2)}
.estado i{width:10px;height:10px;border-radius:50%;background:#888;flex:none}
.estado.ok i{background:var(--ok)}.estado.meio i{background:#F5D04C}.estado.erro i{background:var(--erro)}
.recentes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.recentes button{font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--linha);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dica{color:var(--txt2);font-size:14px;line-height:1.45;margin-top:8px}
.link{color:var(--ouro);text-decoration:underline}
.oculto{display:none!important}
#retorno{margin-top:12px;min-height:1.2em;font-weight:700}
#retorno.ok{color:var(--ok)}#retorno.erro{color:var(--erro)}
</style>
</head>
<body>
<header class="topo">
  <div><h1>Avisos no telão</h1><span class="versao" data-versao></span></div>
  <button class="icone" id="tema" title="Modo claro/escuro"></button>
</header>
<main>
  <section class="card" id="bloco-codigo">
    <label class="rot" for="codigo">Código do projetor</label>
    <input id="codigo" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="······">
    <p class="dica">O mesmo código que aparece na tela do projetor e no Pregador Visual do pastor.</p>
    <button class="botao prim" id="conectar" style="margin-top:12px">Conectar</button>
  </section>

  <section class="card oculto" id="bloco-aviso">
    <div class="estado" id="estado"><i></i><span>Conectando…</span></div>
    <p class="dica">Código <b id="cod-atual"></b> · <a href="#" class="link" id="trocar">trocar</a></p>
  </section>

  <section class="card oculto" id="bloco-form">
    <label class="rot" for="texto">Texto do aviso</label>
    <textarea id="texto" maxlength="400" placeholder="Ex.: Atenção: o carro placa ABC-1234 está com o farol aceso."></textarea>
    <div class="recentes" id="recentes"></div>
    <label class="rot" style="margin-top:14px">Velocidade</label>
    <div class="seg" data-op="vel"><button data-v="lento">Lento</button><button data-v="normal">Normal</button><button data-v="rapido">Rápido</button></div>
    <label class="rot">Repetir</label>
    <div class="seg" data-op="rep"><button data-v="1">1 vez</button><button data-v="3">3 vezes</button><button data-v="0">Sem parar</button></div>
    <label class="rot">Posição</label>
    <div class="seg" data-op="pos"><button data-v="topo">No alto</button><button data-v="base">No rodapé</button></div>
    <label class="rot">Tamanho da letra</label>
    <div class="seg" data-op="tam"><button data-v="p">Pequena</button><button data-v="m">Média</button><button data-v="g">Grande</button></div>
    <div class="botoes"><button class="botao prim" id="mostrar">▶ Mostrar no telão</button><button class="botao" id="parar">■ Tirar</button></div>
    <div id="retorno"></div>
  </section>
</main>
<script>
const VERSAO = '2.9.4';
const { SB_URL, SB_KEY } = window.PV_CONFIG;
const $ = s => document.querySelector(s);
document.querySelectorAll('[data-versao]').forEach(e => e.textContent = 'v' + VERSAO);

/* idioma: o do app neste aparelho, senão o do celular */
const IDIOMA = (() => { try { const v = localStorage.getItem('pv.idioma'); if (v === 'pt' || v === 'en') return v; } catch {} return /^pt/i.test(navigator.language || 'pt') ? 'pt' : 'en'; })();
const EN = { 'Avisos no telão': 'Screen notices', 'Código do projetor': 'Projector code', 'O mesmo código que aparece na tela do projetor e no Pregador Visual do pastor.': "The same code shown on the projector screen and in the pastor's Pregador Visual.",
  'Conectar': 'Connect', 'Conectando…': 'Connecting…', 'Código': 'Code', 'trocar': 'change', 'Texto do aviso': 'Notice text', 'Velocidade': 'Speed', 'Lento': 'Slow', 'Normal': 'Normal', 'Rápido': 'Fast',
  'Repetir': 'Repeat', '1 vez': 'Once', '3 vezes': '3 times', 'Sem parar': 'Nonstop', 'Posição': 'Position', 'No alto': 'Top', 'No rodapé': 'Bottom', 'Tamanho da letra': 'Font size',
  'Pequena': 'Small', 'Média': 'Medium', 'Grande': 'Large', '▶ Mostrar no telão': '▶ Show on screen', '■ Tirar': '■ Remove', 'Modo claro/escuro': 'Light/dark mode',
  'Projetor conectado': 'Projector connected', 'Procurando o projetor…': 'Looking for the projector…', 'O projetor não respondeu. Confira se a página do projetor está aberta no notebook.': 'The projector did not answer. Check that the projector page is open on the laptop.',
  'Sem conexão com a internet': 'No internet connection', '✓ O aviso está no telão': '✓ The notice is on screen', '✓ Aviso retirado': '✓ Notice removed', 'Enviando…': 'Sending…',
  'O código tem 6 letras/números.': 'The code has 6 letters/numbers.', 'Escreva o aviso primeiro.': 'Write the notice first.' };
const T = s => IDIOMA === 'en' && EN[s] ? EN[s] : s;
if (IDIOMA === 'en'){
  document.documentElement.lang = 'en'; document.title = 'Pregador Visual · Notices';
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())){ const k = n.nodeValue.trim(); if (k && EN[k]) n.nodeValue = n.nodeValue.replace(k, EN[k]); }
  document.querySelectorAll('[title]').forEach(el => { const k = el.getAttribute('title'); if (EN[k]) el.setAttribute('title', EN[k]); });
  $('#texto').placeholder = 'E.g.: Attention: the car with plate ABC-1234 has its lights on.';
}

/* tema sol/lua */
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function tema(t){ document.documentElement.setAttribute('data-theme', t); $('#tema').innerHTML = t === 'light' ? LUA : SOL; try { localStorage.setItem('pv.aviso.tema', t); } catch {} }
let tm = 'dark'; try { tm = localStorage.getItem('pv.aviso.tema') || 'dark'; } catch {}
tema(tm); $('#tema').onclick = () => tema(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

/* opções guardadas neste celular */
let opc = { vel: 'normal', rep: '3', pos: 'topo', tam: 'm' };
try { Object.assign(opc, JSON.parse(localStorage.getItem('pv.aviso.opc') || '{}')); } catch {}
function pintarOpc(){ document.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(opc[g.dataset.op]) === b.dataset.v))); }
document.querySelectorAll('.seg').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; opc[g.dataset.op] = b.dataset.v; try { localStorage.setItem('pv.aviso.opc', JSON.stringify(opc)); } catch {} pintarOpc(); }));
pintarOpc();
const recentes = () => { try { return JSON.parse(localStorage.getItem('pv.aviso.recentes') || '[]'); } catch { return []; } };
function pintarRecentes(){ const box = $('#recentes'); box.innerHTML = ''; recentes().forEach(t => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => $('#texto').value = t; box.appendChild(b); }); }
function guardarRecente(t){ try { localStorage.setItem('pv.aviso.recentes', JSON.stringify([t, ...recentes().filter(x => x !== t)].slice(0, 6))); } catch {} pintarRecentes(); }
pintarRecentes();

/* conexão com o projetor (mesmo canal que o iPad usa para os slides) */
const VALIDO = /^[A-HJ-NP-Z2-9]{6}$/;
const limpar = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
let canal = null, respondeu = 0, tPergunta = null;
function estado(tipo, txt){ $('#estado').className = 'estado ' + tipo; $('#estado span').textContent = T(txt); }
function retorno(tipo, txt){ $('#retorno').className = tipo; $('#retorno').textContent = T(txt); }
function conectar(c){
  try { localStorage.setItem('pv.aviso.codigo', c); } catch {}
  $('#bloco-codigo').classList.add('oculto'); $('#bloco-aviso').classList.remove('oculto'); $('#bloco-form').classList.remove('oculto');
  $('#cod-atual').textContent = c; estado('meio', 'Conectando…');
  canal = sb.channel('pv-proj-' + c, { config: { broadcast: { self: false } } });
  canal.on('broadcast', { event: 'aviso-ok' }, ({ payload: p }) => {
    respondeu = Date.now(); estado('ok', 'Projetor conectado');
    if (p && !p.projetor) retorno('ok', p.noAr ? '✓ O aviso está no telão' : '✓ Aviso retirado');
  }).subscribe(st => {
    if (st === 'SUBSCRIBED'){ estado('meio', 'Procurando o projetor…'); perguntar(); }
    else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') estado('erro', 'Sem conexão com a internet');
  });
}
function perguntar(){
  canal.send({ type: 'broadcast', event: 'aviso-pergunta', payload: {} }).catch(() => {});
  clearTimeout(tPergunta);
  tPergunta = setTimeout(() => { if (Date.now() - respondeu > 5000) estado('erro', 'O projetor não respondeu. Confira se a página do projetor está aberta no notebook.'); }, 4000);
}
setInterval(() => { if (canal && document.visibilityState === 'visible') perguntar(); }, 20000);
function enviar(payload){
  if (!canal) return;
  retorno('', 'Enviando…');
  canal.send({ type: 'broadcast', event: 'aviso', payload }).catch(() => retorno('erro', 'Sem conexão com a internet'));
  const t0 = Date.now();
  setTimeout(() => { if (respondeu < t0) retorno('erro', 'O projetor não respondeu. Confira se a página do projetor está aberta no notebook.'); }, 4000);
}
$('#mostrar').onclick = () => {
  const t = $('#texto').value.replace(/\s+/g, ' ').trim();
  if (!t){ retorno('erro', 'Escreva o aviso primeiro.'); return $('#texto').focus(); }
  guardarRecente(t); enviar({ texto: t, ...opc });
};
$('#parar').onclick = () => enviar({ parar: true });
$('#codigo').addEventListener('input', e => { e.target.value = limpar(e.target.value).slice(0, 6); });
$('#conectar').onclick = () => { const c = limpar($('#codigo').value); if (!VALIDO.test(c)){ alert(T('O código tem 6 letras/números.')); return; } conectar(c); };
$('#trocar').onclick = e => { e.preventDefault(); if (canal){ sb.removeChannel(canal); canal = null; } try { localStorage.removeItem('pv.aviso.codigo'); } catch {}
  $('#bloco-aviso').classList.add('oculto'); $('#bloco-form').classList.add('oculto'); $('#bloco-codigo').classList.remove('oculto'); $('#codigo').value = ''; $('#codigo').focus(); };

const inicial = (() => { const u = limpar(new URLSearchParams(location.search).get('codigo')); if (VALIDO.test(u)) return u; try { const c = localStorage.getItem('pv.aviso.codigo'); return c && VALIDO.test(c) ? c : null; } catch { return null; } })();
if (inicial) conectar(inicial);
</script>
</body>
</html>
